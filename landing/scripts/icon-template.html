<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  svg { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
  <!-- ?square=1 → sin esquinas redondeadas (apple-touch-icon: iOS aplica su propia máscara) -->
  <script>
    const rx = new URLSearchParams(location.search).get('square') ? 0 : 14;
    document.body.innerHTML = `<svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><rect width="64" height="64" rx="${rx}" fill="#1e1e2e"/><rect x="12" y="38" width="10" height="14" rx="2" fill="url(#g)"/><rect x="27" y="24" width="10" height="28" rx="2" fill="url(#g)"/><rect x="42" y="12" width="10" height="40" rx="2" fill="url(#g)"/></svg>`;
  </script>
</body>
</html>
