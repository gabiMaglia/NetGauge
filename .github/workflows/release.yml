name: Release

# T-008: publica instaladores Windows + macOS al GitHub Release cuando se
# pushea un tag v*. Workflow independiente de ci.yml: no modifica ni
# reemplaza sus triggers ni jobs (corren por separado).
#
# Proceso: bumpear src/version.py (+ build/installer.iss default si cambia el
# formato) en un commit, taguear vX.Y.Z sobre ese commit y pushear el tag. El
# job `test` falla si el tag no coincide con APP_VERSION.
on:
  push:
    tags:
      - 'v*'

# Minimo privilegio: solo el job publish necesita escribir.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify tag matches src/version.py
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(python build/gen_version_info.py --print-version)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::El tag $TAG no coincide con APP_VERSION=$FILE_VERSION de src/version.py. Bumpear la version antes de taguear."
            exit 1
          fi

      - name: Run tests
        run: pytest

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate version_info.txt from src/version.py
        run: python build/gen_version_info.py

      - name: Build .exe (PyInstaller)
        run: pyinstaller build/network_monitor.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss /DAppVersion=${{ steps.ver.outputs.version }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetGauge-windows-exe
          path: build/Output/NetGauge-Setup-*-x64.exe
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    # Firma + notarización OPCIONALES: si los secrets no existen quedan vacíos
    # y el .dmg sale sin firmar, como siempre. Se mapean a env del job porque
    # `secrets` no se puede usar en `if:`; los scripts solo los leen por env.
    # APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD los usa build/make_dmg.sh.
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate macOS icon (.icns)
        run: python3 build/make_icon_macos.py

      - name: Import Developer ID certificate (optional)
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/netgauge-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/netgauge-cert.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Agrega el keychain temporal a la lista de búsqueda (sin perder los existentes).
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # Identidad: el secret APPLE_CODESIGN_IDENTITY, o la primera
          # "Developer ID Application" del certificado importado.
          IDENTITY="${APPLE_CODESIGN_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No se encontró una identidad 'Developer ID Application' en el certificado importado."
            exit 1
          fi
          echo "NETGAUGE_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build .app bundle (PyInstaller)
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: pyinstaller build/network_monitor_macos.spec --noconfirm

      - name: Build .dmg
        env:
          DMG_VERSION: ${{ steps.ver.outputs.version }}
        run: build/make_dmg.sh ${{ matrix.arch }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetGauge-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/netgauge-cert.p12"

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: NetGauge-windows-exe
          path: release-assets

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetGauge-macos-x86_64
          path: release-assets

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: NetGauge-macos-arm64
          path: release-assets

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum NetGauge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
